name: Build Iscilik Dosyasi

on:
  push:
    paths:
      - 'iscilik/build/TRIGGER'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      VERSION: 1.2.7
      REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Reconstruct source
        shell: pwsh
        run: |
          $parts = Get-ChildItem 'iscilik/build/source.b64.part*' | Sort-Object Name
          if (-not $parts) { throw 'Source chunks missing' }
          $b64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }).Trim()
          [IO.File]::WriteAllBytes('source.tar.gz',[Convert]::FromBase64String($b64))
          New-Item -ItemType Directory -Force -Path work | Out-Null
          tar -xzf source.tar.gz -C work

      - name: Apply v1.1.1 requested-data patch
        shell: pwsh
        run: |
          python iscilik/build/patch_v111.py

      - name: Apply v1.1.2 updater-lock fix
        shell: pwsh
        run: |
          python iscilik/build/patch_v112.py

      - name: Apply v1.2.0 simple-mode patch
        shell: pwsh
        run: |
          python iscilik/build/patch_v120.py

      - name: Apply v1.2.0 runtime UI fix
        shell: pwsh
        run: |
          python iscilik/build/patch_v120_runtime_fix.py

      - name: Apply v1.2.1 simplified time-entry patch
        shell: pwsh
        run: |
          python iscilik/build/patch_v121.py

      - name: Apply v1.2.2 transport patch
        shell: pwsh
        run: |
          python iscilik/build/patch_v122.py

      - name: Apply v1.2.3 full fixture and editable metadata patch
        shell: pwsh
        run: |
          python iscilik/build/patch_v123.py

      - name: Apply v1.2.4 real trip times and team patch
        shell: pwsh
        run: |
          python iscilik/build/patch_v124.py

      - name: Apply v1.2.5 separate work start and transport departure
        shell: pwsh
        run: |
          python iscilik/build/patch_v125.py

      - name: Apply v1.2.6 performance totals presets completion
        shell: pwsh
        run: |
          python iscilik/build/patch_v126.py

      - name: Apply v1.2.7 instant navigation and bulk query patch
        shell: pwsh
        run: |
          python iscilik/build/patch_v127.py

      - name: Add DejaVu fonts
        shell: pwsh
        run: |
          Push-Location work
          npm pack dejavu-fonts-ttf --silent | Out-Null
          $pkg = Get-ChildItem 'dejavu-fonts-ttf-*.tgz' | Select-Object -First 1
          tar -xzf $pkg.FullName
          $dst = 'iscilik_dosyasi/assets/fonts'
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Copy-Item 'package/ttf/DejaVuSans.ttf' $dst
          Copy-Item 'package/ttf/DejaVuSans-Bold.ttf' $dst
          Copy-Item 'package/ttf/DejaVuSans-Oblique.ttf' $dst
          Copy-Item 'package/ttf/DejaVuSansMono.ttf' $dst
          Copy-Item 'package/LICENSE' (Join-Path $dst 'DEJAVU_LICENSE.txt')
          Pop-Location

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r work/requirements-build.txt

      - name: Run regression tests
        shell: pwsh
        run: |
          Push-Location work
          # v1.0.0 çekirdeğinde değişmeyen hesap/delil/rapor testleri.
          # Eski-v0.2 fixture klasörü dağıtım kaynak paketine dahil değildir;
          # ayrıca iki UI testi Unix /tmp yolu ve Windows açık-dosya kilidi nedeniyle
          # CI ortamına özgü olarak hariç tutulur. Nihai EXE selftest aşağıda zorunludur.
          python -m pytest -q tests/test_v111_seed.py tests/test_v112_updater.py tests/test_v120_simple.py tests/test_v120_public_ui.py tests/test_v121_simple_segment.py tests/test_v122_transport.py tests/test_v123_full_fixture.py tests/test_v124_trip_times.py tests/test_v125_work_start.py tests/test_v126_perf_totals.py tests/test_v127_navigation_perf.py
          if ($LASTEXITCODE -ne 0) { throw "version smoke tests failed" }
          python -m pytest -q tests/test_a2_evidence_audit.py tests/test_a3_a5_engine.py tests/test_a7_a8_reports_backup.py -k "not metadata_edit_keeps_file_and_logs_full_audit and not legacy"
          if ($LASTEXITCODE -ne 0) { throw "core regression tests failed" }
          python -m pytest -q tests/test_a9_extra.py -k "not legacy"
          if ($LASTEXITCODE -ne 0) { throw "app/selftest regression failed" }
          python -m compileall -q iscilik_dosyasi main.py
          if ($LASTEXITCODE -ne 0) { throw "compileall failed" }
          Pop-Location

      - name: Build Windows EXE
        shell: pwsh
        run: |
          Push-Location work
          pyinstaller --noconfirm --clean IscilikDosyasi.spec
          Pop-Location

      - name: Run final EXE selftest
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'iscilik-selftest'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $p = Start-Process -FilePath 'work/dist/IscilikDosyasi/IscilikDosyasi.exe' -ArgumentList '--selftest', $out -PassThru -Wait
          $resultPath = Join-Path $out 'selftest_result.json'
          if (Test-Path $resultPath) { Get-Content $resultPath -Raw | Write-Host }
          if ($p.ExitCode -ne 0) { throw "Selftest exit code $($p.ExitCode)" }
          $j = Get-Content $resultPath -Raw | ConvertFrom-Json
          if (-not $j.ok) { throw 'Selftest ok=false' }

      - name: Package and publish release
        shell: pwsh
        run: |
          $releaseDir = 'iscilik/releases'
          New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null
          $zipName = "IscilikDosyasi_v$($env:VERSION)_Windows.zip"
          $zipPath = Join-Path $releaseDir $zipName
          if (Test-Path $zipPath) { Remove-Item $zipPath -Force }
          Compress-Archive -Path 'work/dist/IscilikDosyasi' -DestinationPath $zipPath -CompressionLevel Optimal
          $sha = (Get-FileHash -Algorithm SHA256 $zipPath).Hash.ToLowerInvariant()

          $tag = "iscilik-v$($env:VERSION)"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) { gh release delete $tag --cleanup-tag -y }
          gh release create $tag $zipPath --title "İşçilik Dosyası v$($env:VERSION)" --notes "v1.2.7: Sayfa değiştirirken global refresh_all kaldırıldı. Sayfalar önbellekli/lazy yenilenir, timeline kayıtları tek sorguda toplu yüklenir, gizli tablolar doldurulmaz ve arama debounce edildi."

          $packageUrl = "https://github.com/$env:REPO/releases/download/$tag/$zipName"
          $manifest = [ordered]@{
            version = $env:VERSION
            package_url = $packageUrl
            package_root = 'IscilikDosyasi'
            sha256 = $sha
            release_notes = 'Sayfa geçişlerinde global yenileme kaldırıldı; ekranlar önbellekli/lazy çalışır. Deplasman timeline kayıtları tek sorguda toplu yüklenir, gizli tablolar gereksiz doldurulmaz ve arama debounce edilmiştir.'
            mandatory = $false
            published_at = (Get-Date).ToUniversalTime().ToString('o')
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content 'iscilik/latest.json' -Encoding UTF8

          git config user.name 'iscilik-update-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add iscilik/latest.json
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "publish iscilik v$($env:VERSION) manifest"
            git push
          }
